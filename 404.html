<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada — V2G</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0048F8">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/assets/lp.css">
<style>
  .nao-achou { min-height: calc(100vh - 82px); display: flex; align-items: center; padding-bottom: 200px; }
  .nao-achou .codigo {
    display: inline-block; margin-bottom: 18px; padding: 6px 12px; border-radius: 8px;
    background: var(--marinho); color: var(--lima); font-weight: 800; letter-spacing: .12em; font-size: .85rem;
  }
  .nao-achou .acoes { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; margin-top: 30px; }
  .nao-achou .acoes a:not(.botao) { font-weight: 700; color: var(--marinho); }
  @media (min-width: 960px) { .nao-achou { padding-bottom: 120px; } }
</style>
</head>
<body>

<header class="topo">
  <div class="faixa">
    <a href="/" class="logo" aria-label="V2G, início"><img src="/assets/marca/v2g-logo.svg" alt="V2G" width="104" height="31"></a>
  </div>
</header>

<main class="hero nao-achou">
  <img class="hero-pixels" src="/assets/marca/pixels-escada.svg" alt="" width="306" height="240">
  <div class="faixa hero-texto">
    <p class="codigo">ERRO 404</p>
    <h1 class="titulo-xl">
      <span class="azul">Essa página</span>
      não existe<span class="ponto">.</span>
    </h1>
    <p class="hero-sub">O link pode estar errado, ou a página mudou de lugar.</p>
    <div class="acoes">
      <a href="/" class="botao botao-principal">Voltar para o início <span aria-hidden="true">→</span></a>
      <a href="/#pre-cadastro">Ir para o pré-cadastro</a>
    </div>
  </div>
</main>

</body>
</html>
